[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[tool.ruff]
target-version = "py310" # Permet d'activer la syntaxe with (a, b):

[tool.ruff.lint]
select = ["E", "F", "SIM"] # Active flake8-simplify (SIM)
